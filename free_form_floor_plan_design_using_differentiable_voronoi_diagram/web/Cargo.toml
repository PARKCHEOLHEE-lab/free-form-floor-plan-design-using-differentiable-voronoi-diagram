[package]
name = "voronoi-floorplan-web"
version = "0.1.0"
edition = "2021"
description = "In-browser (wasm) interactive demo of the Rust Voronoi floor-plan optimizer"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# the geometry/optimization core (compiles to wasm32; see ../rust Cargo.toml)
voronoi-floorplan = { path = "../rust" }
geo = "0.30"
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
# rand (pulled transitively by the core) needs getrandom's js backend to
# compile for wasm32, even though the demo only uses seeded ChaCha at runtime.
getrandom = { version = "0.2", features = ["js"] }

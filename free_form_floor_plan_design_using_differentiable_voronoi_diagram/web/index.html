<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Floor Plan Generation with Voronoi Diagram</title>
  <style>
    /* Self-hosted PT Sans (vendored, no CDN) — matches the reference site's
       design system: PT Sans, flat surfaces (border + tint, no shadows or
       gradients), em-based spacing. Room/plot colors stay semantic. */
    @font-face {
      font-family: "PT Sans";
      src: local("PT Sans"), local("PTSans-Regular"), url("./fonts/PTSans-Regular.woff") format("woff");
      font-weight: normal; font-style: normal; font-display: swap;
    }
    @font-face {
      font-family: "PT Sans";
      src: local("PT Sans Bold"), local("PTSans-Bold"), url("./fonts/PTSans-Bold.woff") format("woff");
      font-weight: bold; font-style: normal; font-display: swap;
    }

    :root {
      --font: "PT Sans", -apple-system, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --dark: #000;
      --light: #fff;
      --text-dark: #000;   /* match the reference site: body text is pure black */
      --link: #66a1ff;
      --featured: #0011e3;
      --bg-subtle: #f7f7f8;
      --divider: #e5e5e6;
      --reduce-14: rgba(128, 128, 128, 0.14);
      --reduce-30: rgba(128, 128, 128, 0.30);
      --reduce-90: rgba(128, 128, 128, 0.90);
    }

    * { box-sizing: border-box; }
    html { overflow-x: clip; }
    body {
      margin: 0;
      background: var(--light);
      color: var(--dark);
      font-family: var(--font);
      font-size: calc(0.76rem + 0.2vw);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* the reference keeps backgrounds flat even in dark mode */
    @media (prefers-color-scheme: dark) { body { background: var(--light); color: var(--dark); } }

    .wrap { max-width: 940px; margin: 0 auto; padding: 2.8em clamp(1.2em, 4vw, 2.4em) 3.4em; }

    /* one restrained, staggered load reveal */
    @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    header, .lede, .stage, footer { animation: rise .55s cubic-bezier(.2, .7, .2, 1) both; }
    .lede { animation-delay: .08s; }   /* intro paragraph under the header */
    .stage { animation-delay: .14s; }
    footer { animation-delay: .26s; }
    @media (prefers-reduced-motion: reduce) { header, .lede, .stage, footer { animation: none; } }

    header { margin-bottom: 1.1em; }
    h1 { font-size: 1.7em; font-weight: bold; letter-spacing: -0.015em; margin: 0 0 .15em; }
    .sub { color: var(--text-dark); margin: 0; text-align: justify; }
    .lede { color: var(--text-dark); margin: 0 0 1.6em; text-align: justify; }   /* intro paragraph under the header */
    .lede p { margin: 0 0 .9em; }
    .lede p:last-child { margin-bottom: 0; }
    .lede strong { color: var(--dark); font-weight: bold; }

    a { color: var(--link); text-decoration: inherit; }
    a:hover { text-decoration: underline; }
    code { font-family: var(--mono); background: var(--bg-subtle); padding: .05em .35em; border-radius: 3px; font-size: .92em; }

    .stage { display: grid; grid-template-columns: minmax(0, 1fr) 268px; gap: 2em; align-items: start; }
    @media (max-width: 760px) { .stage { grid-template-columns: 1fr; } }

    canvas#plan { width: 100%; aspect-ratio: 1 / 1; border: 1px solid var(--divider); border-radius: 8px; background: var(--light); touch-action: none; display: block; }
    /* loss panel section subtitle (styled like LAYOUT / WALL / … via .label) */
    .canvas-sub { margin-top: .9em; }
    /* per-term loss graphs: one row each (label · own-scale sparkline); the
       current value rides the playhead as a per-row tag (see .vtag below) */
    .losspanel { margin-top: 0; position: relative; }   /* relative: the playhead spans the rows */
    .lossrow { display: flex; align-items: center; gap: .7em; margin: .34em 0; }
    .lossrow .lk { width: 3.4em; flex: none; color: var(--text-dark); }
    .lossrow .spark { flex: 1 1 auto; min-width: 0; height: 30px; border: 1px solid var(--divider); border-radius: 6px; background: var(--light); display: block; }
    .lossrow .spark polyline { fill: none; stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
    #sp_total { stroke: #66a1ff; } #sp_wall { stroke: #e08a5a; } #sp_area { stroke: #5aa469; }
    #sp_jog { stroke: #479a9c; }
    #sp_lloyd { stroke: #8c7bd0; } #sp_topo { stroke: #c75d8f; }
    /* vertical playhead marking the current iteration (replaces the plain iter text) */
    .playhead { position: absolute; width: 0; border-left: 1px dotted rgba(20,20,20,.55); pointer-events: none; display: none; }
    .playhead .tick { position: absolute; top: -2.15em; transform: translateX(-50%);
      font-family: var(--mono); font-size: .76em; color: var(--light); background: var(--dark);
      padding: .05em .45em; border-radius: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .playhead .tick::after { content: ""; position: absolute; left: var(--tail-x, 50%); bottom: -4px; transform: translateX(-50%);
      border: 4px solid transparent; border-top-color: var(--dark); border-bottom: 0; }
    /* per-row value tags ride the playhead, centered on the line (top set per row in JS);
       each is a speech balloon with a downward tail in its own term colour (--c) */
    .playhead .vtag { position: absolute; left: 0; transform: translate(-50%, -50%); color: var(--light); background: var(--c);
      font-family: var(--mono); font-size: .72em; padding: .02em .34em; border-radius: 3px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .playhead .vtag::after { content: ""; position: absolute; left: var(--tail-x, 50%); bottom: -4px; transform: translateX(-50%);
      border: 4px solid transparent; border-top-color: var(--c); border-bottom: 0; }
    #vt_total { --c: #66a1ff; } #vt_wall { --c: #e08a5a; } #vt_area { --c: #5aa469; }
    #vt_jog { --c: #479a9c; }
    #sp_cosine { stroke: #4676b8; } #vt_cosine { --c: #4676b8; }
    #vt_lloyd { --c: #8c7bd0; } #vt_topo { --c: #c75d8f; }

    .controls { font-size: .96em; }
    .group { margin-bottom: 1.5em; }
    .label { font-weight: bold; font-size: .76em; text-transform: uppercase; letter-spacing: .07em; color: var(--reduce-90); margin-bottom: .6em; }

    .row { display: flex; align-items: center; gap: .7em; margin: .5em 0; }
    #cosine-weight[hidden] { display: none; }
    .row > label { width: 3.4em; flex: none; color: var(--text-dark); }
    .row .val { width: 3em; flex: none; text-align: right; font-family: var(--mono); font-size: .85em; color: var(--dark); font-variant-numeric: tabular-nums; }

    /* thin track + link-colored thumb (the reference's scrubber) */
    input[type=range] {
      -webkit-appearance: none; appearance: none; flex: 1 1 auto; min-width: 0;
      height: 4px; border-radius: 3px; background: var(--reduce-30); outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none; width: 14px; height: 14px; border-radius: 50%;
      background: var(--link); cursor: pointer; transition: transform .1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.18); }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none; border-radius: 50%; background: var(--link); cursor: pointer; }

    input[type=number] {
      font-family: var(--mono); font-size: .85em; width: 4.6em; padding: .3em .4em;
      border: 1px solid var(--reduce-30); border-radius: 4px; background: var(--light); color: var(--dark);
    }
    input[type=number]:focus { outline: none; border-color: var(--featured); }

    /* room-ratio rows reuse the .row grid so their slider tracks line up exactly
       with sites/rooms/wall/loss; the colour swatch sits in the 3.4em label slot. */
    .roomareas { margin: .1em 0 .2em; }
    .roomareas .row { margin: .32em 0; }
    .roomareas .raswatch { width: 3.4em; flex: none; display: flex; align-items: center; justify-content: center; }
    .roomareas .sw { width: 11px; height: 11px; border-radius: 50%; border: 1px solid var(--reduce-30); flex: none; }

    .seg { display: flex; flex-wrap: wrap; gap: .35em; }
    .seg button {
      flex: 1 1 auto; padding: .42em .5em; border: 1px solid var(--reduce-30); background: transparent;
      border-radius: 4px; font: inherit; font-size: .85em; color: var(--text-dark); cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
    }
    .seg button:hover:not(.active) { background: var(--reduce-14); color: var(--dark); }
    .seg button.active { background: var(--dark); border-color: var(--dark); color: var(--light); }


    .actions { display: flex; gap: .4em; margin-bottom: 1.5em; }
    .actions button {
      flex: 1; padding: .62em; border: 1px solid var(--reduce-30); background: transparent; border-radius: 4px;
      font: inherit; font-weight: bold; color: var(--dark); cursor: pointer;
      transition: background .12s, border-color .12s, opacity .12s;
    }
    .actions button:hover:not(:disabled) { background: var(--reduce-14); }
    .actions button.primary { background: var(--dark); border-color: var(--dark); color: var(--light); }
    .actions button.primary:hover:not(:disabled) { background: var(--dark); }
    .actions button:disabled { opacity: .4; cursor: default; }

    footer { margin-top: 3em; padding-top: 1.3em; border-top: 1px solid var(--divider); color: var(--text-dark); font-size: .85em; max-width: 72ch; }

    /* Canvas UI: the plan canvas covers the window (view.resize reads its width and height)
       and every control floats over it: icon toolbars in the corners, one settings panel at
       a time beside its toolbar, and the loss card at the bottom left. The plan's own look
       (pastel cells, double-line walls, sites, loss colours) is unchanged. */
    @font-face {
      font-family: "Geist"; src: url("./fonts/Geist-Variable.woff2") format("woff2");
      font-weight: 100 900; font-style: normal; font-display: swap;
    }
    :root {
      --font: "Geist", -apple-system, "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
      --ui-fg: #0a0a0a; --ui-muted: #f5f5f5; --ui-muted-fg: #737373; --ui-border: #e5e5e5;
      --ui-edge: 32px;
      --ui-card-shadow: 0 0 0 1px rgba(10, 10, 10, .1), 0 10px 15px -3px rgba(0, 0, 0, .1), 0 4px 6px -4px rgba(0, 0, 0, .1);
    }
    html, body { height: 100%; overflow: hidden; }
    body { font-size: 14px; color: var(--ui-fg); }
    .wrap { max-width: none; padding: 0; }
    .stage, .canvas-card, .controls { display: contents; }
    .planbox { position: fixed; inset: 0; }
    .planbox canvas#plan { width: 100%; height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; }

    .toolbar, .panel, .losscard { position: fixed; background: var(--light); border-radius: 14px; box-shadow: var(--ui-card-shadow); }
    .toolbar { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; z-index: 2; }
    .toolbar.tl { top: var(--ui-edge); left: var(--ui-edge); }
    .toolbar .sep { width: 20px; height: 1px; margin: 3px 0; background: var(--ui-border); }
    .tool { width: 32px; height: 32px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 10px;
      background: transparent; color: var(--ui-fg); cursor: pointer; transition: background .12s; }
    .tool:hover, .tool[aria-pressed=true] { background: var(--ui-muted); }
    .tool:focus-visible { outline: 2px solid var(--ui-muted-fg); outline-offset: 1px; }
    .tool.primary { background: var(--ui-fg); color: var(--light); }
    .tool.primary:hover { background: #262626; }
    .tool:disabled { opacity:.4; cursor:default; }
    /* hover names: each icon's or gizmo end's aria-label, shown beside it after a short pause
       (aria-label is the one source, so Run's name follows Pause and Resume) */
    .tool { position: relative; }
    .tool::after, .axis::after { content: attr(aria-label); position: absolute; top: 50%; transform: translateY(-50%);
      padding: 4px 8px; border-radius: 6px; background: var(--ui-fg); color: var(--light); font: 500 12px/1.2 var(--font);
      white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; }
    .tool::after { left: calc(100% + 10px); }
    .axis::after { right: calc(100% + 8px); }  /* the gizmo is at the right edge */
    .tool:hover::after, .tool:focus-visible::after,
    .axis:hover::after, .axis:focus-visible::after { opacity: 1; transition-delay: .12s; }

    /* top-right: the view gizmo, the plan's axes as the camera sees them, floating with no card;
       a drag in it rotates the view and a click on an end turns the view to that side */
    .gizmo { position: fixed; top: var(--ui-edge); right: var(--ui-edge); width: 84px; height: 84px; z-index: 2;
      cursor: grab; touch-action: none; user-select: none; }
    .gizmo svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .gizmo line { stroke-width: 2; stroke-linecap: round; }
    .axis { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; padding: 0; border: 0;
      border-radius: 50%; background: var(--axis); color: #fff; font: 600 10px/18px var(--font); text-align: center;
      cursor: pointer; z-index: var(--z); }
    .axis[data-axis^="-"] { width: 12px; height: 12px; margin: -6px 0 0 -6px; background: color-mix(in srgb, var(--axis) 40%, #fff); }
    .axis:hover, .axis:focus-visible { z-index: 9; outline: 2px solid var(--ui-fg); outline-offset: 1px; }
    .ic { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .panel { display: none; top: var(--ui-edge); left: calc(var(--ui-edge) + 48px); width: min(300px, calc(100vw - 2 * var(--ui-edge) - 48px)); max-height: calc(100dvh - 2 * var(--ui-edge));
      overflow-y: auto; padding: 14px 16px; z-index: 1; }
    .panel.open { display: block; }
    /* panels are see-through, so the plan stays visible behind an open panel */
    .panel { background: rgba(255, 255, 255, .75); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
    .panel .label, .losscard .label { font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--ui-fg); margin-bottom: 8px; }
    .losscard { left: var(--ui-edge); bottom: var(--ui-edge); width: min(420px, calc(100vw - 2 * var(--ui-edge))); padding: 12px 14px 10px; }
    .losscard .canvas-sub { margin-top: 0; }
    .lossrow { margin: 2px 0; }
    .lossrow .lk { color: var(--ui-muted-fg); font-size: 12px; }
    .lossrow .spark { height: 20px; border-color: var(--ui-border); }

    .row > label { color: var(--ui-muted-fg); }
    .row .val, .readout { font-size: 12px; color: var(--ui-fg); }
    input[type=range] { background: var(--ui-border); }
    input[type=range]::-webkit-slider-thumb { background: var(--light); border: 1.5px solid var(--ui-fg); }
    input[type=range]::-moz-range-thumb { background: var(--light); border: 1.5px solid var(--ui-fg); }
    .seg button { border-color: var(--ui-border); border-radius: 8px; color: var(--ui-fg); }
    .seg button:hover:not(.active) { background: var(--ui-muted); }
    .seg button.active { background: var(--ui-muted); border-color: var(--ui-border); color: var(--ui-fg); font-weight: 600; }
    .panel .seg { margin-bottom: 4px; }
  #boundary-sketch { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:2; color:var(--featured); }
  #boundary-sketch [hidden], #boundary-sketch[hidden] { display:none; }
  #boundary-sketch polyline, #boundary-sketch line { fill:none; stroke:currentColor; stroke-width:2; }
  #boundary-sketch line { stroke-dasharray:5 4; }
  #boundary-sketch circle { fill:var(--light); stroke:currentColor; stroke-width:2; }
  #boundary-sketch [data-first] { fill:currentColor; }
  #boundary-sketch[data-snap=free] [data-cursor] { stroke-width:1; }
  #plan[data-boundary-drawing] { cursor:crosshair !important; }
  #boundary-sketch text { font:600 12px var(--font); fill:currentColor; stroke:var(--light); stroke-width:4px; paint-order:stroke; }
  .boundary-actions, #custom-boundaries:not(:empty) { margin-top:10px; }
  #bubble-labels { position:fixed; inset:0; pointer-events:none; z-index:1; }
  .bubble-label { position:absolute; transform:translate(-50%,-50%); padding:3px 5px; border-radius:4px; color:var(--ui-fg); background:rgba(255,255,255,.9); font:10px/1.2 var(--font); white-space:nowrap; }
  .bubble-label.selected { background:var(--ui-fg); color:white; }
  .bubble-label.draft { background:white; color:var(--ui-muted-fg); }
  .bubble-handle { position:absolute; width:8px; height:8px; border:1px solid var(--ui-fg); border-radius:50%; background:white; transform:translate(-50%,-50%); }
  .bubble-tools { margin-bottom:10px; }
  .bubble-help { margin:8px 0; color:var(--ui-muted-fg); font:11px/1.5 var(--font); }
  .roomareas .row { justify-content:space-between; }
  .roomareas .raswatch { justify-content:flex-start; gap:4px; }
  #rooms_v { margin-left:auto; }
  .bubble-help.error { color:#a12b2b; }
  #program-status { font:11px/1.5 var(--font); margin-top:8px; }
  .panel[data-panel=rooms] { overflow:auto; }
  .room-row, .connection-row { width:100%; display:flex; align-items:center; justify-content:space-between; padding:4px 0; border:0; border-radius:4px; background:transparent; color:inherit; font:inherit; text-align:left; cursor:pointer; }
  .room-row:hover, .connection-row:hover, .room-row.selected, .connection-row.selected { background:var(--ui-muted); }
  .room-row:focus-visible, .connection-row:focus-visible { outline:2px solid var(--ui-muted-fg); }
  .bubble-actions { margin-bottom:10px; }
  .bubble-tools button:disabled, .bubble-actions button:disabled { opacity:.45; cursor:default; }
</style>

<body>
<div class="wrap">
  <div class="stage">
    <div class="canvas-card">
      <div class="planbox"><canvas id="plan" width="520" height="520" tabindex="0" aria-label="Floor plan editor"></canvas><div id="bubble-labels"></div>
        <svg id="boundary-sketch" aria-hidden="true" hidden><polyline></polyline><line hidden></line><circle data-first r="4" hidden></circle><circle data-cursor r="5" hidden></circle><text hidden></text></svg>
      </div>
      <!-- status text is no longer shown (the playhead + buttons convey run state);
           kept hidden so the existing state/error setters never hit a null node -->
      <span id="status" hidden></span>
      <div class="losscard" id="losscard">
      <div class="label canvas-sub">Loss</div>
      <div class="losspanel" id="losspanel">
        <div class="lossrow"><span class="lk">total</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_total" /></svg></div>
        <div class="lossrow"><span class="lk">wall</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_wall" /></svg></div>
        <template id="cosine-chart-row"><div class="lossrow"><span class="lk">Cos</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_cosine" /></svg></div></template>
        <div class="lossrow"><span class="lk">step</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_jog" /></svg></div>
        <div class="lossrow"><span class="lk">area</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_area" /></svg></div>
        <div class="lossrow"><span class="lk">lloyd</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_lloyd" /></svg></div>
        <div class="lossrow"><span class="lk">topo</span><svg class="spark" viewBox="0 0 100 24" preserveAspectRatio="none"><polyline id="sp_topo" /></svg></div>
        <div class="playhead" id="playhead"><span class="tick" id="tick"></span><span class="vtag" id="vt_total"></span><span class="vtag" id="vt_wall"></span><span class="vtag" id="vt_jog"></span><span class="vtag" id="vt_area"></span><span class="vtag" id="vt_lloyd"></span><span class="vtag" id="vt_topo"></span></div>
      </div>
      </div>
    </div>

    <!-- Icons: Lucide (lucide.dev), ISC License, Copyright (c) for portions of Lucide are held by
         Cole Bemis 2013-2022 as part of Feather (MIT); all other copyright (c) for Lucide are held
         by Lucide Contributors 2022. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></symbol>
        <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></symbol>
        <symbol id="i-boundary" viewBox="0 0 24 24"><path d="M3.5 8.7c-.7.5-1 1.4-.7 2.2l2.8 8.7c.3.8 1 1.4 1.9 1.4h9.1c.9 0 1.6-.6 1.9-1.4l2.8-8.7c.3-.8 0-1.7-.7-2.2l-7.4-5.3a2.1 2.1 0 0 0-2.4 0Z"/></symbol>
        <symbol id="i-rooms" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
        <symbol id="i-weights" viewBox="0 0 24 24"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></symbol>

    <!-- top-left: run controls, then one icon per settings panel -->
    <nav class="toolbar tl" aria-label="Run and settings">

      <button class="tool" data-open="rooms" aria-label="Rooms"><svg class="ic"><use href="#i-rooms"/></svg></button>

      <button class="tool" data-toggle="losses" aria-label="Losses" aria-pressed="true"><svg class="ic"><use href="#i-losses"/></svg></button>
    </nav>

    <!-- top-right: the view gizmo (web/plan/gizmo.js fills it) -->
    <div class="gizmo" role="group" aria-label="View direction"></div>

        <div class="row"><label for="align_tol">Wall snap</label><input id="align_tol" type="range" min="0.02" max="1" step="0.001" value="0.02"><span class="val" id="align_tol_v">0.020</span></div>

        <div class="row" id="cosine-weight" hidden><label for="w_cosine">Cos</label><input id="w_cosine" type="range" min="0" max="1" step="0.01" value="1"><span class="val" id="w_cosine_v">1.00</span></div>
        <div class="row"><label for="w_jog">step</label><input id="w_jog" type="range" min="0" max="1" step="0.01" value="0.01"><span class="val" id="w_jog_v">0.01</span></div>
        <div class="row"><label>area</label><input id="w_area" type="range" min="0" max="1" step="0.01" value="0.10"><span class="val" id="w_area_v">0.10</span></div>
        <div class="row"><label>lloyd</label><input id="w_lloyd" type="range" min="0" max="1" step="0.01" value="0.12"><span class="val" id="w_lloyd_v">0.12</span></div>
        <div class="row"><label>topo</label><input id="w_topo" type="range" min="0" max="1" step="0.01" value="0.06"><span class="val" id="w_topo_v">0.06</span></div>
      </section>

      <section class="panel" data-panel="optimize">
        <div class="label">Optimization</div>
        <div class="row"><label>iters</label><input id="iters" type="range" min="50" max="5000" step="10" value="800"><span class="val" id="iters_v">800</span></div>
        <div class="row"><label>lr</label><input id="lr" type="range" min="0.001" max="0.05" step="0.001" value="0.005"><span class="val" id="lr_v">0.005</span></div>
        <div class="row"><label>seed</label><input id="seed" type="range" min="0" max="5000" step="1" value="777"><span class="val" id="seed_v">777</span></div>
      </section>
    </div>
  </div>

</div>

<script type="module">
// matplotlib Accent colormap blended 50% over white — opaque pastel room fills
// matching the reference look (the native renderer uses Accent at alpha 0.5).
const COLORS = ['#bfe4bf', '#ded7ea', '#fee0c2', '#ffffcc', '#9cb6d8', '#f881bf', '#dfad8b', '#b3b3b3'];
const R = 1.18; // normalized boundaries fit within radius 1

// three.js draws the plan in 3D: it opens isometric with the plan flat on the floor, the wheel
// zooms (0.5x to 8x), the mouse rotates and pans, and a double-click returns to isometric
import { createPlanView } from './plan/view3d.js';
import { BubbleProgram } from './plan/bubbles.js';
import { createBubbleEditor } from './plan/bubble-editor.js';
import { createBoundaryEditor } from './plan/boundary-editor.js';
const view = createPlanView(document.getElementById('plan'), { gizmo: document.querySelector('.gizmo') });
const $ = id => document.getElementById(id);
const wallExperiment = new URLSearchParams(location.search).get('wall');
const cosineWall = wallExperiment === 'cosine';
const mixedWall = wallExperiment === 'mixed';

// ---------- wall alignment (web/plan) ----------
// Raw draws the optimizer's cells as they are; Aligned welds them into rooms that share
// corners and snaps nearly parallel walls (voronoi/postprocess.py, after GSDiff).
import { fromCells, roomRings } from './plan/graph.js';
import { alignPlan, alignedShare } from './plan/align.js';
import { evaluatePlan } from './plan/openings.js';
const SIMPLIFY_TOL = 0.004;  // the kink tolerance web/src/lib.rs uses for room outlines
const pointMergeInput = $('merge_tol');
const wallSnapInput = $('align_tol');
let wallsMode = 'raw';
let boundaryRing = null;     // sent by the worker once the optimizer is built
// Align one frame; returns room rings and the aligned-wall share before and after.
function alignFrame(f) {
  const n = roomCount();
  const g = fromCells(f.cells, boundaryRing, { roomCount: n, simplifyTol: SIMPLIFY_TOL });
  const raw = fromCells(f.cells, boundaryRing, { roomCount: n, simplifyTol: 0 });
  const before = alignedShare(g, boundaryRing);
  alignPlan(g, boundaryRing, {
    mergeTol: pointMergeInput.valueAsNumber,
    snapTol: wallSnapInput.valueAsNumber,
  });
  return { raw, aligned:g, rooms: Array.from({ length: n }, (_, r) => roomRings(g, r)), before, after: alignedShare(g, boundaryRing) };
}
$('walls').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...$('walls').children].forEach(x => x.classList.toggle('active', x === b));
  wallsMode = b.dataset.walls;
  if (lastFrame) drawFrame(lastFrame);
});
// Each weighted loss contribution has its own y-scale.
const LOSS_TERMS = ['total', 'wall', ...(mixedWall ? ['cosine'] : []), 'jog', 'area', 'lloyd', 'topo'];
if (mixedWall) {
  $('w_wall').labels[0].textContent = 'L1';
  $('cosine-weight').hidden = false;
  const wallRow = $('sp_wall').closest('.lossrow');
  wallRow.querySelector('.lk').textContent = 'L1';
  wallRow.after($('cosine-chart-row').content.cloneNode(true));
  const tag = document.createElement('span');
  tag.className = 'vtag';
  tag.id = 'vt_cosine';
  $('vt_wall').after(tag);
}

let lastFrame = null;                          // last rendered cell-frame, for resize redraw
let wallWidth = 0.02;                          // wall thickness (normalized half-width); JS-only render param

function redraw() {
  view.resize();                               // the loss graphs are SVG (viewBox-scaled), no resize needed
  if (lastFrame) drawFrame(lastFrame);
  else if (boundaryRing && currentProgram()) view.draw({outline:boundaryRing,rooms:[],walls:[boundaryRing],lines:[boundaryRing],wall:wallWidth});
  else view.clear();
  drawSparks();
}
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(redraw, 120); });

let mode = 'shape_e';     // active preset or custom boundary
const customBoundaries = new Map();
let pendingBoundary = null;
let built = false;        // the worker holds an optimizer for the current params
let running = false;
let paused = false;
let runFinished = false;
let maxIters = 300;
const hist = Object.fromEntries(LOSS_TERMS.map(term => [term, []]));
const clearHist = () => { for (const t in hist) hist[t].length = 0; };
let gen = 0, curGen = 0;  // build generation; frames from a superseded build are dropped

// The optimizer lives in a Web Worker, so every wasm step runs OFF the main
// thread; the UI stays responsive and only renders the frames it streams back.
const worker = new Worker('./worker.js', { type: 'module' });
const programs = new Map(); // retain each boundary's circles when switching presets
const DOOR_WIDTH = 0.1;
let editingBubbles = false;
const currentProgram = () => programs.get(mode) ?? null;
const roomCount = () => currentProgram()?.snapshot().rooms.length ?? roomRatios.length;
const colorForRoomId = id => COLORS[(id-1)%COLORS.length];
const bubbleHelp = $('bubble-message').textContent;
const editor = createBubbleEditor($('plan'),view,{
  labels:$('bubble-labels'),colorForRoomId,
  onChange({commit,selectionOnly}) {
    if(selectionOnly){refreshRoomReadout();return;}
    if(!editingBubbles){editingBubbles=true;stop();}
    refreshRoomReadout();
    $('program-status').textContent=commit?'Updating plan...':'Editing rooms...';
    $('program-status').dataset.state='editing';
    if(commit){editingBubbles=false;rebuildPreviewSoon();}
    setButtons();
  },
  onStatus(message,error=!!message) {
    $('bubble-message').textContent=message||bubbleHelp;
    $('bubble-message').classList.toggle('error',error);
  }
});
const boundaryHint = 'Click to add a point. Click the first point to close. Hold Shift for X/Y. Backspace undoes a point. Esc cancels.';
function boundaryMessage(error = '') {
  const message = $('boundary-message');
  message.textContent = error || boundaryHint;
  message.classList.toggle('error', !!error);
}
const boundaryEditor = createBoundaryEditor($('plan'), view, {
  overlay: $('boundary-sketch'),
  isBuilding: () => !!pendingBoundary,
  reference: () => boundaryRing ?? [],
  onActive(active) {
    $('boundary-draw').setAttribute('aria-pressed', String(active));
    $('boundary-draw').classList.toggle('active', active);
    $('boundary-message').hidden = !active;
    if (active) boundaryMessage();
    setButtons();
  },
  onClose: addBoundary,
  onError: boundaryMessage,
});
$('boundary-draw').addEventListener('click', () => {
  if (boundaryEditor.active) boundaryEditor.cancel();
  else boundaryEditor.start();
});
function setBubbleTool(name) {
  if (pendingBoundary) return;
  boundaryEditor.cancel();
  if(name==='draw'){
    if(!boundaryRing)return;
    if(!currentProgram()){
      programs.set(mode,new BubbleProgram(boundaryRing));stop();
      clearHist();hidePlayhead();redraw();
      $('program-status').textContent='Draw at least one room.';
    }
    editor.setProgram(currentProgram());
  }
  editor.setTool(name);
  document.querySelectorAll('[data-bubble-tool]').forEach(b=>{const active=b.dataset.bubbleTool===name;b.setAttribute('aria-pressed',String(active));b.classList.toggle('active',active);});
  refreshRoomReadout();setButtons();
}
document.querySelectorAll('[data-bubble-tool]').forEach(b=>b.addEventListener('click',()=>setBubbleTool(b.dataset.bubbleTool)));
$('bubble-delete').addEventListener('click',()=>editor.deleteSelection());
$('roomareas').addEventListener('click',e=>{const b=e.target.closest('[data-room-id]');if(b)editor.selectRoom(+b.dataset.roomId);});
$('connections').addEventListener('click',e=>{const b=e.target.closest('[data-from]');if(b)editor.selectLink(+b.dataset.from,+b.dataset.to);});
window.addEventListener('pagehide',()=>{editor.dispose();boundaryEditor.dispose();});
$('show-bubbles').addEventListener('change',()=>editor.setVisible($('show-bubbles').checked));
$('show-doors').addEventListener('change',()=>{if(lastFrame)drawFrame(lastFrame);});

// ---------- inputs ----------
const SLIDERS = ['sites','wall','merge_tol','align_tol','w_wall','w_cosine','w_jog','w_area','w_lloyd','w_topo','iters','lr','seed'];
const IMPORTANCE_IDS = new Set(['w_wall','w_cosine','w_jog','w_area','w_lloyd','w_topo']);
// Shared slider -> readout formatter (used by the live listeners and applyPreset).
function fmtVal(id, v) {
  return (id === 'lr' || id === 'wall' || id.endsWith('_tol')) ? (+v).toFixed(3)
       : IMPORTANCE_IDS.has(id) ? (+v).toFixed(2)
       : (+v % 1 ? (+v).toFixed(1) : String(+v));
}
for (const id of SLIDERS) {
  const el = $(id), out = $(id + '_v');
  el.addEventListener('input', () => { out.textContent = fmtVal(id, el.value); });
}

// The wall slider is a pure render parameter (canvas stroke width) — update the
// JS value and redraw the last frame; no wasm round-trip.
$('wall').addEventListener('input', () => {
  wallWidth = +$('wall').value;
  if (lastFrame) drawFrame(lastFrame);
});
for (const input of [pointMergeInput, wallSnapInput]) {
  input.addEventListener('input', () => {
    if (lastFrame) drawFrame(lastFrame);
  });
}

// sites / rooms change the optimizer geometry (site count, room count), so rebuild
// and preview live — no need to press Reset. Debounced so a drag rebuilds once on
// settle (and stops any running optimization), not on every intermediate step.
let rebuildTimer = 0;
function rebuildPreviewSoon() {
  if (pendingBoundary) return;
  clearTimeout(rebuildTimer);
  $('status').textContent=mode+' · building...';
  rebuildTimer = setTimeout(() => {
    rebuildTimer = 0;
    stop();
    $('status').textContent = mode + ' · building…';
    sendBuild('preview');
  }, 50);
}
$('sites').addEventListener('input', rebuildPreviewSoon);
// seed reseeds the site initialization, so a committed seed change (Enter / blur /
// spinner) rebuilds the preview too — no need to press Run or Reset.
$('seed').addEventListener('change', rebuildPreviewSoon);

let roomRatios = []; // legacy preset shares; edited inputs come only from BubbleProgram
function refreshRoomReadout() {
  const input=currentProgram()?.snapshot();
  const weights=input?.ratios ?? roomRatios;
  const sum=weights.reduce((a,b)=>a+b,0)||1;
  $('rooms_v').textContent=String(weights.length);
  $('roomareas').innerHTML=weights.map((v,i)=>{
    const id=input?input.rooms[i].id:i+1;
    const content=`<span class="raswatch"><i class="sw" style="background:${input?colorForRoomId(id):COLORS[i%COLORS.length]}"></i> R${id}</span><span class="val">${Math.round(v/sum*100)}%</span>`;
    return input?`<button type="button" class="room-row${editor.selected===id?' selected':''}" data-room-id="${id}" aria-label="Select room R${id}">${content}</button>`:`<div class="row">${content}</div>`;
  }).join('');
  const selected=editor.selectedLink;
  $('connections').innerHTML=(input?.links??[]).map(([a,b])=>{
    const x=input.rooms[a].id,y=input.rooms[b].id;
    return `<button type="button" class="connection-row${selected&&selected[0]===x&&selected[1]===y?' selected':''}" data-from="${x}" data-to="${y}" aria-label="Select door link R${x} to R${y}">R${x} / R${y}</button>`;
  }).join('');
  $('bubble-delete').disabled=!input||(editor.selected===null&&editor.selectedLink===null);
  document.querySelector('[data-bubble-tool=link]').disabled=!input||input.rooms.length<2;
}

// Angle and step use their native dimensionless scales. Area/Lloyd/topology
// retain the previous reference scales measured for the demo (2026-06).
const LOSS_SCALES = { w_wall: 13.0, w_jog: 1.0, w_area: 0.49, w_lloyd: 5.3, w_topo: 4.0 };

function params(ratios) {
  const weights = ratios.map(r => Math.max(0, r));
  const wsum = weights.reduce((a, b) => a + b, 0) || 1;
  // Importance is divided by the corresponding native scale; bb/cell stay off.
  const imp = id => +$(id).value;
  return {
    sites: +$('sites').value,
    ratios: Float64Array.from(weights, w => w / wsum),
    w: [
      imp('w_wall')  / LOSS_SCALES.w_wall,
      imp('w_area')  / LOSS_SCALES.w_area,
      imp('w_lloyd') / LOSS_SCALES.w_lloyd,
      imp('w_topo')  / LOSS_SCALES.w_topo,
      0, 0,
    ],
    jogWeight: imp('w_jog') / LOSS_SCALES.w_jog,
    iters: +$('iters').value,
    lr: +$('lr').value,
    seed: +$('seed').value | 0,
  };
}

// Build (or rebuild) the optimizer for the selected boundary in the worker.
// `then` is what the worker does once built: 'preview' or 'start' (run).
function sendBuild(then, candidate = null) {
  clearTimeout(rebuildTimer);rebuildTimer=0;
  if (!candidate) runFinished=false;
  const input = candidate ? null : currentProgram()?.snapshot();
  const custom = candidate ?? customBoundaries.get(mode);
  if(input&&!input.rooms.length){$('status').textContent='Draw at least one room.';$('program-status').textContent='Draw at least one room.';clearHist();hidePlayhead();redraw();return false;}
  const p = params(input?.ratios ?? custom?.ratios ?? roomRatios);
  maxIters = p.iters;
  curGen = ++gen;
  worker.postMessage({ cmd: 'build', gen: curGen, mode: candidate?.mode ?? mode,
    ...(custom ? { kind: 'custom', boundary: custom.ring } : { kind: 'shape' }),
    sites: p.sites, ratios: p.ratios, w: p.w, cosineWall, jogWeight: p.jogWeight, seed: p.seed, lr: p.lr, iters: p.iters, then,
    ...(mixedWall ? {cosineWeight: $('w_cosine').valueAsNumber} : {}),
    ...(input?{program:{...input,doorWidth:DOOR_WIDTH}}:{}) });
  return true;
}

// ---------- worker messages ----------
worker.onmessage = (e) => {
  const m = e.data;
  // drop frames/results from a build that has since been superseded
  if (['frame','built','done','error'].includes(m.type) && m.gen !== undefined && m.gen !== curGen) return;
  switch (m.type) {
    case 'ready':
      break;
    case 'error':
      if (pendingBoundary) {
        pendingBoundary = null;
        boundaryMessage(m.msg);
        setButtons();
        break;
      }
      $('status').textContent = m.msg;
      if(currentProgram())$('program-status').textContent=m.msg;
      $('program-status').dataset.state='error';
      running = false; paused = false; setButtons();
      break;
    case 'built':
      built = true;
      boundaryRing = m.boundary;
      if (pendingBoundary) {
        const added = pendingBoundary;
        pendingBoundary = null;
        customBoundaries.set(added.mode, added);
        const button = document.createElement('button');
        button.type = 'button';
        button.dataset.mode = added.mode;
        button.setAttribute('aria-pressed', 'false');
        button.textContent = 'Custom ' + customBoundaries.size;
        $('custom-boundaries').append(button);
        activateBoundary(added.mode);
        $('boundary-message').hidden = true;
        runFinished = false;
      }
      editor.setProgram(currentProgram());
      setButtons();
      break;
    case 'frame':
      lastFrame = m.frame;
      if (m.mode === 'preview') {
        $('status').textContent = mode + ' · ready to Run';
        if(currentProgram())$('program-status').textContent='Ready to run.';
        clearHist(); pushLoss(m.frame);   // seed the panel with iter-0 values (graphs fill on Run)
      } else {
        pushLoss(m.frame);
      }
      drawFrame(m.frame);                 // after pushLoss, so the playhead value tags read the current hist
      break;
    case 'done':
      running = false; paused = false; setButtons();
      runFinished=true;
      if(lastFrame)drawFrame(lastFrame);
      $('status').textContent = currentProgram()?$('program-status').textContent:'done';
      break;
  }
};

// ---------- presets ----------
// Per-boundary starting configuration. A boundary listed here loads that full
// control set when selected (sites, rooms + per-room area shares, loss importance,
// wall-alignment, optimization); a boundary with no entry only switches the shape
// and keeps the current controls.
const PRESETS = {
  // A — orthogonal staircase boundary, 5 rooms tuned to fill each step (user preset, 2026-06).
  shape_a: {
    sites: 80, rooms: 5,
    roomRatios: [0.13, 0.30, 0.23, 0.13, 0.21],  // normalized shares 13/30/23/13/21%
    wall: 0.02,
    w_wall: 1.00, w_jog: 0.01, w_area: 0.15, w_lloyd: 0.01, w_topo: 0.20,
    iters: 1000, lr: 0.005, seed: 777,
  },
  // B — orthogonal boundary, 7 rooms (user preset, 2026-06).
  shape_b: {
    sites: 80, rooms: 7,
    roomRatios: [0.12, 0.12, 0.25, 0.16, 0.07, 0.12, 0.15],  // displayed shares 12/12/25/16/7/12/15%
    wall: 0.02,
    w_wall: 1.00, w_jog: 0.01, w_area: 0.15, w_lloyd: 0.01, w_topo: 0.20,
    iters: 500, lr: 0.005, seed: 4217,
  },
  // C — orthogonal boundary, 5 rooms (user preset, 2026-06).
  shape_c: {
    sites: 80, rooms: 5,
    // displayed shares 12/27/32/12/19% — the image's integers sum to 102 (rounding),
    // so the weights are normalized to sum 1.0 here to reproduce that exact readout.
    roomRatios: [0.116, 0.266, 0.316, 0.116, 0.186],
    wall: 0.02,
    w_wall: 1.00, w_jog: 0.01, w_area: 0.15, w_lloyd: 0.01, w_topo: 0.20,
    iters: 500, lr: 0.005, seed: 3764,
  },
  // D — diagonal boundary tuned for local wall-alignment (user preset, 2026-06).
  shape_d: {
    sites: 80, rooms: 6,
    roomRatios: [0.34, 0.13, 0.05, 0.22, 0.13, 0.13],  // normalized shares 34/13/5/22/13/13%
    wall: 0.02,
    w_wall: 1.00, w_jog: 0.01, w_area: 0.15, w_lloyd: 0.01, w_topo: 0.20,
    iters: 500, lr: 0.005, seed: 2153,
  },
  // E — orthogonal runs with two diagonal walls, 6 rooms (user preset, 2026-06).
  shape_e: {
    sites: 80, rooms: 6,
    roomRatios: [0.13, 0.11, 0.21, 0.20, 0.11, 0.24],  // normalized shares 13/11/21/20/11/24%
    wall: 0.02,
    w_wall: 1.00, w_jog: 0.01, w_area: 0.15, w_lloyd: 0.01, w_topo: 0.20,
    iters: 500, lr: 0.005, seed: 4971,
  },
};

// Bulk-apply a boundary's preset to the controls (no-op + false when none). Sets
// values + readouts directly (no synthetic input events) so the single sendBuild
// in the click handler stays the only rebuild; rooms is special-cased because
// changing the count regenerates the per-room sliders before the ratios can load.
function applyPreset(mode) {
  const p = PRESETS[mode];
  if (!p) return false;
  const set = (id, val) => { $(id).value = val; const o = $(id + '_v'); if (o) o.textContent = fmtVal(id, val); };
  set('sites', p.sites);
  set('wall', p.wall);
  set('w_wall', mixedWall ? 0.5 : p.w_wall); set('w_jog', p.w_jog); set('w_area', p.w_area); set('w_lloyd', p.w_lloyd); set('w_topo', p.w_topo);
  if (mixedWall) set('w_cosine', 1);
  set('iters', p.iters); set('lr', p.lr);
  set('seed', p.seed);
  roomRatios = p.roomRatios.slice();
  refreshRoomReadout();
  return true;
}

function activateBoundary(nextMode) {
  mode = nextMode;
  document.querySelectorAll('#presets button, #custom-boundaries button').forEach(button => {
    const active = button.dataset.mode === mode;
    button.classList.toggle('active', active);
    if (button.parentElement.id === 'custom-boundaries') button.setAttribute('aria-pressed', String(active));
  });
  editor.setProgram(null);
  editingBubbles = false;
  const custom = customBoundaries.get(mode);
  if (custom) roomRatios = custom.ratios;
  else applyPreset(mode);
  setBubbleTool('select');
}

function addBoundary(ring) {
  pendingBoundary = { mode: 'custom_' + (customBoundaries.size + 1), ring, ratios: roomRatios.slice() };
  const message = $('boundary-message');
  message.hidden = false;
  message.textContent = 'Building boundary…';
  setButtons();
  sendBuild('preview', pendingBoundary);
}

function selectBoundary(e) {
  const button = e.target.closest('button[data-mode]');
  if (!button || pendingBoundary) return;
  activateBoundary(button.dataset.mode);
  boundaryRing = currentProgram()?.boundary ?? null;
  $('boundary-message').hidden = true;
  stop();
  $('status').textContent = mode + ' · building…';
  sendBuild('preview');
}
$('presets').addEventListener('click', selectBoundary);
$('custom-boundaries').addEventListener('click', selectBoundary);

// ---------- drawing ----------
// Hand one frame to the view. Raw shows the optimizer's cells: pastel fills (matplotlib Accent
// over white), double-line walls on the room outlines, faint grey cell lines on top, and the
// sites. Aligned shows the welded and snapped rooms, each filled even-odd with its holes.
// The camera fits the boundary, so switching Raw and Aligned keeps the zoom and pan.
function drawFrame(f) {
  const input=currentProgram()?.snapshot();
  const color=r=>input?colorForRoomId(input.rooms[r].id):COLORS[r%COLORS.length];
  const al = boundaryRing ? alignFrame(f) : null;
  let doors=[];
  if(input&&al){
    const result=evaluatePlan(wallsMode==='aligned'?al.aligned:al.raw,input,DOOR_WIDTH,{finished:runFinished,running});
    $('program-status').dataset.state=result.state;
    $('program-status').textContent=result.state==='complete'?'Complete: all room centers and door links satisfied.':
      result.state==='unmet'?'Unmet: '+result.issues.map(i=>i.message).join(' '):
      (running?'Optimizing. ':'Ready to run. ')+result.issues.map(i=>i.message).join(' ');
    if($('show-doors').checked)doors=result.doors;
  }else{$('program-status').textContent='';delete $('program-status').dataset.state;}
  if (al) $('align_v').textContent = `${Math.round(al.before * 100)}% → ${Math.round(al.after * 100)}%`;
  if (wallsMode === 'aligned' && al) {
    view.draw({
      outline: boundaryRing,
      rooms: al.rooms.map((rings, r) => ({ rings, color: color(r) })),
      walls: al.rooms.flat(),
      wall: wallWidth,
      doors,
    });
  } else {
    view.draw({
      outline: boundaryRing,
      rooms: f.cells.map(cell => ({ rings: [cell.ring], color: color(cell.room) })),
      walls: f.walls || [],
      lines: f.cells.map(cell => cell.ring),
      points: f.sites,
      wall: wallWidth,
      doors,
    });
  }
  movePlayhead(f.iteration);   // the current-iteration playhead replaces the old iter/loss text
}

// Redraw every per-term sparkline. Each graph normalizes to its OWN min/max so
// a small term (topo) still shows its shape next to a large one. (The current
// value is shown by the per-row tags on the playhead — see movePlayhead.)
function drawSparks() {
  const den = Math.max(1, maxIters - 1);
  for (const t of LOSS_TERMS) {
    const h = hist[t], pl = $('sp_' + t);
    if (h.length < 2) { pl.removeAttribute('points'); continue; }
    const lo = Math.min(...h), hi = Math.max(...h), span = hi - lo || 1;
    pl.setAttribute('points', h.map((v, i) => {
      const x = i / den * 100;                 // viewBox is 0..100 wide
      const y = 23 - (v - lo) / span * 22;     // 0..24 tall, 1px top/bottom pad
      return x.toFixed(2) + ',' + y.toFixed(2);
    }).join(' '));
  }
}
// Record the weighted loss contributions and redraw.
function pushLoss(f) {
  hist.total.push(f.loss);
  hist.wall.push(f.wall);
  if (mixedWall) hist.cosine.push(f.cosine ?? 0);
  hist.jog.push(f.jog);
  hist.area.push(f.area);
  hist.lloyd.push(f.lloyd);
  hist.topo.push(f.topo);
  drawSparks();
}

// Position the vertical playhead at the current iteration and label it. Reads the
// spark boxes' live geometry, so it stays aligned across resizes / column widths.
function movePlayhead(iter) {
  const ph = $('playhead'), tick = $('tick');
  const pr = $('losspanel').getBoundingClientRect();
  const first = $('sp_total').closest('.spark').getBoundingClientRect();
  const last = $('sp_topo').closest('.spark').getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, iter / Math.max(1, maxIters - 1)));
  ph.style.display = 'block';
  ph.style.left = (first.left - pr.left) + frac * first.width + 'px';
  ph.style.top = (first.top - pr.top) + 'px';
  ph.style.height = (last.bottom - first.top) + 'px';
  tick.textContent = 'iter ' + iter;
  clampBubble(tick, frac, first.width, false);
  // value tags ride the line, one per row at its spark's vertical center, showing
  // that term's current value; clamped to stay inside the graph (tail tracks the line)
  for (const t of LOSS_TERMS) {
    const tag = $('vt_' + t);
    const r = $('sp_' + t).closest('.spark').getBoundingClientRect();
    tag.style.top = (r.top + r.height / 2 - first.top) + 'px';
    tag.textContent = hist[t].length ? hist[t][hist[t].length - 1].toFixed(3) : '';
    clampBubble(tag, frac, first.width, true);
  }
}
// Keep a speech bubble (centered on the line at playhead-local x=0) inside the graph
// [0..w]: clamp its body to the nearest edge once it would overflow, and point its
// tail (--tail-x) back at the line so only the tail moves past that point.
function clampBubble(el, frac, w, vertical) {
  const half = el.offsetWidth / 2;
  const center = Math.max(-frac * w + half, Math.min((1 - frac) * w - half, 0));
  const c = center - half;                       // px shift from the natural left:0 position
  el.style.transform = vertical ? 'translate(' + c + 'px, -50%)' : 'translateX(' + c + 'px)';
  // the tail tracks the line, but stays within the bubble (4px = the triangle's half-width)
  // so it never hangs off the edge; once clamped it ends up flush in a bottom corner
  el.style.setProperty('--tail-x', Math.max(4, Math.min(el.offsetWidth - 4, -c)) + 'px');
  // square that bottom corner so the tail joins the bubble flush (no gap vs the rounding)
  el.style.borderBottomLeftRadius = center > 0 ? '0' : '';
  el.style.borderBottomRightRadius = center < 0 ? '0' : '';
}
function hidePlayhead() { $('playhead').style.display = 'none'; }

// ---------- run loop ----------
function stop() {
  clearTimeout(rebuildTimer);rebuildTimer=0;
  running = false; paused = false;
  runFinished=false;
  $('program-status').dataset.state='ready';
  curGen = ++gen;                 // invalidate any in-flight frames from the prior build
  worker.postMessage({ cmd: 'dispose' });
  built = false;
  lastFrame = null;
  setButtons();
}

// One Run / Pause / Resume toggle (the separate Pause button is merged in here).
function setButtons() {
  const label = running ? 'Pause' : (paused ? 'Resume' : 'Run');
  $('run').setAttribute('aria-label', label);   // also its hover name
  $('run').querySelector('use').setAttribute('href', running ? '#i-pause' : '#i-play');
  const sketching = boundaryEditor.active || !!pendingBoundary;
  $('run').disabled=sketching||editingBubbles||!!(currentProgram()&&!roomCount());
  $('boundary-draw').disabled = !boundaryRing || running || paused || !!pendingBoundary;
  $('reset').disabled = sketching;
}

// ---------- toolbars ----------
// One settings panel at a time: an icon opens its panel, another icon swaps it, the same
// icon closes it.
let openPanel = null;
function showPanel(name) {
  if (pendingBoundary) return;
  openPanel = openPanel === name ? null : name;
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('open', p.dataset.panel === openPanel));
  document.querySelectorAll('button[data-open]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.open === openPanel)));
}
document.querySelectorAll('button[data-open]').forEach(b => b.addEventListener('click', () => showPanel(b.dataset.open)));
// The loss card shows by default; its icon hides and shows it. The redraw only re-places the
// playhead tags (they measure the card), the plan itself does not move.
document.querySelector('button[data-toggle=losses]').addEventListener('click', e => {
  const card = $('losscard');
  card.hidden = !card.hidden;
  e.currentTarget.setAttribute('aria-pressed', String(!card.hidden));
  if (lastFrame) drawFrame(lastFrame);
});

$('run').onclick = () => {
  if (running) {                         // running → pause
    running = false; paused = true; setButtons();
    $('status').textContent = 'paused';
    worker.postMessage({ cmd: 'pause' });
    return;
  }
  if (paused && built) {                 // paused → resume
    paused = false; running = true; setButtons();
    $('status').textContent = mode + ' · optimizing…';
    worker.postMessage({ cmd: 'resume' });
    return;
  }
  clearHist();                           // fresh run
  if (!sendBuild('start')) return;
  running = true; paused = false; setButtons();
  $('status').textContent = mode + ' · optimizing…';
};

$('reset').onclick = () => {
  stop();
  clearHist(); drawSparks(); hidePlayhead();
  $('status').textContent = mode + ' · building…';
  sendBuild('preview');
};

view.resize();
applyPreset(mode);  // load the default boundary's preset on first load (same as clicking it)
$('status').textContent = mode + ' · building…';
sendBuild('preview');
</script>

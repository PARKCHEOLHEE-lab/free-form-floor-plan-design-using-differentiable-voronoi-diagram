[package]
name = "voronoi-floorplan"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust port of free-form floor plan design using a differentiable Voronoi diagram"
license = "MIT"

[lib]
name = "voronoi_floorplan"

# Cross-target dependencies — the geometry/optimization core, which also
# compiles to wasm32 for the in-browser demo (see ../web).
[dependencies]
geo = "0.30"
# Martinez-Rueda boolean ops in pure f64 (no coordinate re-quantization, so
# clipped Voronoi neighbors keep bitwise-shared edges and unions weld exactly).
# The 0.3.2 crates.io release pins geo-types 0.6; master moved to geo-types 0.7
# but was never released, hence the pinned git rev.
geo-booleanop = { git = "https://github.com/21re/rust-geo-booleanop", rev = "b9bbdbb34ebfa2aaeb99665842e64ede1696ed65" }
rand = "0.8"
rand_chacha = "0.3"
serde_json = "1"
voronoice = "0.2"

# Native-only: the CLI binary, GIF/tfevents IO, and thread parallelism. The
# wasm build excludes these — it runs serial gradients (bitwise identical, since
# each gradient entry is independent) and renders to a <canvas>, not a GIF.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
crc32c = "0.6"
gif = "0.13"
tiny-skia = "0.11"
rayon = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

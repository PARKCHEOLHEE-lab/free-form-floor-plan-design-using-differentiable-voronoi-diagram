[package]
name = "voronoi-floorplan"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust port of free-form floor plan design using a differentiable Voronoi diagram"
license = "MIT"

[lib]
name = "voronoi_floorplan"

[dependencies]
geo = "0.30"
# Martinez-Rueda boolean ops in pure f64 (no coordinate re-quantization, so
# clipped Voronoi neighbors keep bitwise-shared edges and unions weld exactly).
# The 0.3.2 crates.io release pins geo-types 0.6; master moved to geo-types 0.7
# but was never released, hence the pinned git rev.
geo-booleanop = { git = "https://github.com/21re/rust-geo-booleanop", rev = "b9bbdbb34ebfa2aaeb99665842e64ede1696ed65" }
voronoice = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
